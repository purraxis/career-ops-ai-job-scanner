<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Career Ops Job Scanner</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Career Ops</p>
        <h1>Job Scanner Dashboard</h1>
      </div>
      <div class="actions">
        <button id="refreshState" type="button">Refresh Data</button>
        <button id="rebuildState" type="button">Rebuild JSON</button>
      </div>
    </header>

    <main>
      <section class="stats" aria-label="Scanner summary">
        <div>
          <span id="lastScan">-</span>
          <label>Last Scan</label>
        </div>
        <div>
          <span id="pipelineCount">0</span>
          <label>Pipeline</label>
        </div>
        <div>
          <span id="needsReviewCount">0</span>
          <label>Needs Review</label>
        </div>
        <div>
          <span id="rejectedCount">0</span>
          <label>Rejected</label>
        </div>
      </section>

      <section class="controls" aria-label="Job filters">
        <input id="search" type="search" placeholder="Search company, role, location, reason">
        <select id="providerFilter">
          <option value="">All providers</option>
        </select>
        <select id="viewFilter">
          <option value="pipeline">Pipeline</option>
          <option value="needs_review">Needs review</option>
          <option value="rejected">Rejected</option>
        </select>
      </section>

      <section class="board">
        <div class="board-header">
          <h2 id="viewTitle">Pipeline</h2>
          <p id="viewMeta">0 jobs</p>
        </div>
        <div id="jobList" class="job-list"></div>
      </section>

      <section class="future">
        <h2>Explicit Token-Cost Actions</h2>
        <p>Resume, cover letter, application answer, and AI evaluation actions should be wired here later. The dashboard itself only reads local files and does not call an LLM.</p>
        <div class="future-actions">
          <button type="button" disabled>Generate Resume</button>
          <button type="button" disabled>Generate Cover Letter</button>
          <button type="button" disabled>Evaluate Job With AI</button>
        </div>
      </section>
    </main>

    <template id="jobCardTemplate">
      <article class="job-card">
        <div class="job-main">
          <h3></h3>
          <p class="company"></p>
          <p class="meta"></p>
          <p class="action-status"></p>
          <p class="reason"></p>
        </div>
        <div class="job-actions">
          <a target="_blank" rel="noreferrer">Open</a>
          <button class="move" type="button">Move to Pipeline</button>
          <button class="reject" type="button">Reject</button>
          <button class="applied" type="button">Mark Applied</button>
          <button class="token-action" type="button" disabled>Resume</button>
          <button class="token-action" type="button" disabled>Letter</button>
        </div>
      </article>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
