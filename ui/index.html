<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Career Ops Job Scanner</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <p class="eyebrow">Career Ops</p>
          <h1>Job Scanner</h1>
        </div>

        <nav class="nav">
          <button class="nav-item active" type="button" data-view="pipeline">
            <span>Pipeline</span>
            <strong id="pipelineCount">0</strong>
          </button>
          <button class="nav-item" type="button" data-view="needs_review">
            <span>Needs Review</span>
            <strong id="needsReviewCount">0</strong>
          </button>
          <button class="nav-item" type="button" data-view="rejected">
            <span>Rejected</span>
            <strong id="rejectedCount">0</strong>
          </button>
          <button class="nav-item" type="button" data-view="scan_summary">
            <span>Scan Summary</span>
          </button>
          <button class="nav-item" type="button" data-view="company_coverage">
            <span>Company Coverage</span>
          </button>
        </nav>

        <div class="sidebar-meta">
          <label>Last scan</label>
          <strong id="lastScan">-</strong>
          <label>Action log</label>
          <strong id="actionCount">0 actions</strong>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="viewKicker">Review Queue</p>
            <h2 id="viewTitle">Pipeline</h2>
            <p id="viewMeta">0 jobs</p>
          </div>
          <div class="actions">
            <button id="refreshState" type="button">Refresh</button>
            <button id="rebuildState" type="button">Rebuild State</button>
          </div>
        </header>

        <section class="controls" aria-label="Job filters">
          <input id="search" type="search" placeholder="Search company, role, location, reason">
          <select id="providerFilter">
            <option value="">All providers</option>
          </select>
          <select id="reasonFilter">
            <option value="">All reasons</option>
          </select>
          <label class="check-control">
            <input id="showHandled" type="checkbox">
            <span>Show handled</span>
          </label>
        </section>

        <section id="jobWorkspace" class="review-layout">
          <section class="job-table-panel" aria-label="Jobs">
            <div class="job-table-head">
              <span>Role</span>
              <span>Provider</span>
              <span>Date</span>
            </div>
            <div id="jobRows" class="job-rows"></div>
          </section>

          <aside id="detailPanel" class="detail-panel" aria-label="Selected job detail">
            <p class="empty">Select a job to inspect details.</p>
          </aside>
        </section>

        <section id="summaryView" class="data-view" hidden>
          <div id="summaryContent" class="data-grid"></div>
        </section>

        <section id="coverageView" class="data-view" hidden>
          <div id="coverageContent" class="data-grid"></div>
        </section>
      </main>
    </div>

    <template id="jobRowTemplate">
      <button class="job-row" type="button">
        <span class="row-main">
          <strong class="row-title"></strong>
          <span class="row-company"></span>
          <span class="row-reason"></span>
        </span>
        <span class="row-provider"></span>
        <span class="row-date"></span>
      </button>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
